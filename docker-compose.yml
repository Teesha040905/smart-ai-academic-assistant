# Run the whole stack locally in production mode:
#   cp .env.example .env   (fill in JWT_SECRET and AI keys)
#   docker compose up --build
# Frontend: http://localhost:3000   API: http://localhost:8000/docs
services:
  db:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      MONGODB_URL: mongodb://db:27017
      MONGODB_DB: smart_academic
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      FILE_STORAGE: local
      UPLOAD_DIR: /app/uploads
      VECTOR_STORE: mongo
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        BACKEND_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  mongo_data:
  uploads_data:
